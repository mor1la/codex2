---
# Endpoint/bucket profiles are independent of a running source MongoDB.
backup_archives:
  lab:
    endpoint: http://10.23.0.10:19000
    region: msk
    bucket: mongo-dr
    prefix: pbm
    access_key: mongo-dr-pbm
    secret_key: "{{ dr_s3_secret }}"

# Parameters used only when preparing the optional laboratory S3 service.
s3_bind_address: 10.23.0.10
s3_endpoint: "{{ backup_archives.lab.endpoint }}"
s3_region: "{{ backup_archives.lab.region }}"
s3_root_secret: "{{ dr_s3_root_secret }}"
s3_secret: "{{ dr_s3_secret }}"
