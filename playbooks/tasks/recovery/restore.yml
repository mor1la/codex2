---
- name: Verify the recorded experimental checkpoint
  when: restore_manifest | length > 0
  block:
    - name: Install the verification program independently of the MongoDB role
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/experiment.py"
        dest: "{{ pbm_home }}/experiment.py"
        mode: "0755"

    - name: Install expected state on the destination
      ansible.builtin.copy:
        src: "{{ restore_manifest }}"
        dest: "{{ pbm_home }}/expected.json"
        mode: "0600"

    - name: Compare documents, SHA-256, indexes and collection validation
      ansible.builtin.command: "{{ pbm_home }}/drctl {{ pbm_home }}/experiment.py verify --report {{ pbm_home }}/expected.json"
      register: restore_verification
      changed_when: false

- name: Attach successful verification details to the shared restore report
  ansible.builtin.set_fact:
    pbm_restore_verification: "{{ restore_verification.stdout | from_json }}"
  when: restore_manifest | length > 0
