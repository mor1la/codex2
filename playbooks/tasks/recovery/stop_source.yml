---
- name: Stop source services only for an explicitly requested exercise
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop:
    - "{{ hostvars[restore_source].pbm_service }}-backup.timer"
    - "{{ hostvars[restore_source].pbm_service }}-pbm.service"
    - "{{ hostvars[restore_source].mongodb_service }}.service"
  delegate_to: "{{ restore_source }}"
  when: restore_stop_source | bool

- name: Verify the source database is stopped during the exercise
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hostvars[restore_source].mongodb_port }}"
    state: stopped
    timeout: 10
  delegate_to: "{{ restore_source }}"
  when: restore_stop_source | bool

- name: Record source outage time in UTC
  ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
  register: restore_outage
  delegate_to: "{{ restore_source }}"
  changed_when: false
  when: restore_stop_source | bool

