---
all:
  vars:
    ansible_user: root
  children:
    storage:
      hosts:
        benchmark-storage:
          ansible_host: 192.0.2.10
    mongodb:
      vars:
        scaling_instance: true
        mongodb_home: /srv/mongo-dr-benchmark
        mongodb_service: mongo-dr-benchmark
        mongodb_user: mongo-dr-benchmark
        mongodb_uid: null
        mongodb_port: 27217
        mongodb_replica: drbench
        mongodb_cache_gb: 0.25
        mongodb_oplog_mb: 512
        pbm_install_packages: false
        pbm_schedule_enabled: false
        pbm_metrics_enabled: false
        pbm_archive: scaling
      hosts:
        benchmark-source:
          ansible_host: 192.0.2.11
          pbm_pitr_enabled: true
        benchmark-target:
          ansible_host: 192.0.2.12
          pbm_pitr_enabled: false
    pbm_agents:
      children:
        mongodb: {}
