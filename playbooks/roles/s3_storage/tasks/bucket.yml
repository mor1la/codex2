---
- name: Configure the S3 identity and bucket as gateway administrator
  vars:
    s3_admin_command: ["/opt/mongo-dr-s3/{{ s3_version }}/versitygw", admin]
  environment:
    ADMIN_ACCESS_KEY_ID: "{{ s3_root_access }}"
    ADMIN_SECRET_ACCESS_KEY: "{{ s3_root_secret }}"
    ADMIN_ENDPOINT_URL: "{{ s3_endpoint }}"
    ADMIN_REGION: "{{ s3_region }}"
  no_log: true
  block:
    - name: Read existing S3 identities
      ansible.builtin.command:
        argv: "{{ s3_admin_command + ['list-users'] }}"
      register: s3_users
      changed_when: false

    - name: Create the PBM identity
      ansible.builtin.command:
        argv: >-
          {{ s3_admin_command + ['create-user', '--access', s3_access,
                                 '--secret', s3_secret, '--role', 'user'] }}
      when: s3_access not in s3_users.stdout

    - name: Check for the bucket on the dedicated object volume
      ansible.builtin.stat:
        path: "{{ s3_home }}/objects/{{ s3_bucket }}"
      register: s3_bucket_dir

    - name: Create the bucket owned by the PBM identity
      ansible.builtin.command:
        argv: >-
          {{ s3_admin_command + ['create-bucket', '--bucket', s3_bucket,
                                 '--owner', s3_access] }}
      when: not s3_bucket_dir.stat.exists
