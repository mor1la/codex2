---
# Laboratory adapter; the pbm role also accepts these variables directly.
pbm_home: "{{ mongodb_home }}"
pbm_user: "{{ mongodb_user }}"
pbm_service: "{{ mongodb_service }}"
pbm_database_service: "{{ mongodb_service }}"
pbm_uri: "mongodb://{{ mongodb_admin_user | urlencode | replace('/', '%2F') }}:{{ mongodb_admin_password | urlencode | replace('/', '%2F') }}@127.0.0.1:{{ mongodb_port }}/?authSource=admin&replicaSet={{ mongodb_replica }}"
pbm_agent_uri: "mongodb://{{ mongodb_admin_user | urlencode | replace('/', '%2F') }}:{{ mongodb_admin_password | urlencode | replace('/', '%2F') }}@127.0.0.1:{{ mongodb_port }}/?authSource=admin&directConnection=true"
pbm_archive: lab
pbm_s3_endpoint: "{{ backup_archives[pbm_archive].endpoint }}"
pbm_s3_region: "{{ backup_archives[pbm_archive].region }}"
pbm_s3_bucket: "{{ backup_archives[pbm_archive].bucket }}"
pbm_s3_prefix: "{{ backup_archives[pbm_archive].prefix }}"
pbm_s3_access: "{{ backup_archives[pbm_archive].access_key }}"
pbm_s3_secret: "{{ backup_archives[pbm_archive].secret_key }}"
