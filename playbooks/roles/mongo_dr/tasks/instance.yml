---
- name: Create laboratory group
  ansible.builtin.group:
    name: mongo-dr
    gid: "{{ dr_uid }}"
    system: true

- name: Create laboratory service user
  ansible.builtin.user:
    name: mongo-dr
    group: mongo-dr
    uid: "{{ dr_uid }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create laboratory directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: mongo-dr
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ dr_home }}", owner: root, mode: "0750"}
    - {path: "{{ dr_home }}/data", owner: mongo-dr, mode: "0700"}

- name: Install database configuration and systemd units
  ansible.builtin.template:
    src: "{{ item.src }}.j2"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0644') }}"
  notify: Restart laboratory services
  loop:
    - {src: mongod.yml, dest: "{{ dr_home }}/mongod.yml", group: mongo-dr, mode: "0640"}
    - {src: mongod.service, dest: /etc/systemd/system/mongo-dr.service}
    - {src: pbm.service, dest: /etc/systemd/system/mongo-dr-pbm.service}

- name: Install replica-set key and connection environment
  ansible.builtin.copy:
    dest: "{{ dr_home }}/{{ item.name }}"
    content: "{{ item.content }}\n"
    owner: mongo-dr
    group: mongo-dr
    mode: "0400"
  loop:
    - {name: key, content: "{{ mongo_dr_key }}"}
    - name: pbm.env
      content: 'PBM_MONGODB_URI="mongodb://dradmin:{{ mongo_dr_password }}@127.0.0.1:{{ dr_port }}/?authSource=admin&replicaSet={{ dr_replica }}"'
  no_log: true
  notify: Restart laboratory services

- name: Install laboratory programs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ dr_home }}/{{ item }}"
    mode: "0755"
  loop:
    - bootstrap.py
    - drctl
    - experiment.py
    - health.py
    - archive_s3.py

- name: Start laboratory database
  ansible.builtin.systemd_service:
    name: mongo-dr
    state: started
    enabled: true
    daemon_reload: true

- name: Bootstrap authenticated single-member replica set
  ansible.builtin.command: "{{ dr_home }}/drctl {{ dr_home }}/bootstrap.py {{ dr_replica }} {{ dr_port }}"
  register: dr_bootstrap
  changed_when: "'initialized' in dr_bootstrap.stdout"
  when: not ansible_check_mode
