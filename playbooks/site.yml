---
- name: Validate inventory and WireGuard addresses
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check inventory shape
      ansible.builtin.assert:
        that:
          - groups.storage | length == 1
          - groups.source | length == 1
          - groups.recovery | length == 1
          - groups.mongo | length == 2
      run_once: true

    - name: Read WireGuard addresses
      ansible.builtin.command: ip -o -4 addr show dev wg0
      register: dr_wireguard
      changed_when: false
      check_mode: false

    - name: Confirm inventory address
      ansible.builtin.assert:
        that: "wg_ip + '/' in dr_wireguard.stdout"

- name: Provision backup storage
  hosts: storage
  become: true
  roles:
    - s3_storage

- name: Provision isolated MongoDB instances
  hosts: mongo
  become: true
  roles:
    - mongo_dr
