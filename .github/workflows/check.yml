---
name: Static checks
on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ansible-core==2.19.4
      - run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventory/hosts.example.yml "$playbook" --syntax-check
          done
          python -m py_compile playbooks/roles/mongo_dr/files/*.py
          bash -n playbooks/roles/mongo_dr/files/drctl
          bash -n scripts/init-secrets.sh
