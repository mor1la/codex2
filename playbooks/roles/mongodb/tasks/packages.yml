---
- name: Require the supported distribution for pinned MongoDB packages
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_release == 'noble'
      - ansible_architecture == 'x86_64'
    fail_msg: The laboratory MongoDB installation targets Ubuntu 24.04 amd64. Use only the pbm role for an existing database.

- name: Validate credentials
  ansible.builtin.assert:
    that:
      - mongodb_admin_password | length >= 16
      - mongodb_key is match('^[A-Za-z0-9+/=]{6,1024}$')
  no_log: true

- name: Install Percona repository manager
  ansible.builtin.apt:
    deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb

- name: Enable Percona repositories
  ansible.builtin.command: "percona-release enable {{ item.repo }} release"
  args:
    creates: "/etc/apt/sources.list.d/{{ item.file }}-release.list"
  loop:
    - {repo: psmdb-80, file: percona-psmdb-80}
  register: mongodb_repositories

- name: Install pinned server and laboratory Python dependencies
  ansible.builtin.apt:
    name:
      - "{{ mongodb_package }}"
      - percona-mongodb-mongosh
      - python3-pymongo
    update_cache: true
    cache_valid_time: "{{ 0 if mongodb_repositories.changed else 3600 }}"
    policy_rc_d: 101

