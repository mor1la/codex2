---
- name: Install PBM configuration
  ansible.builtin.template:
    src: pbm.yml.j2
    dest: "{{ dr_home }}/pbm.yml"
    mode: "0640"
    group: mongo-dr
  no_log: true
  register: dr_pbm_file

- name: Enable the PBM agent
  ansible.builtin.systemd_service:
    name: mongo-dr-pbm
    state: started
    enabled: true

- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: Inspect managed PBM configuration
  ansible.builtin.command: "{{ dr_home }}/drctl pbm config --list"
  register: dr_config
  changed_when: false
  failed_when: dr_config.rc != 0 and 'no documents in result' not in dr_config.stderr
  no_log: true
  when: not ansible_check_mode

- name: Read desired PBM configuration
  ansible.builtin.set_fact:
    dr_pbm_expected: "{{ lookup('ansible.builtin.template', 'pbm.yml.j2') | from_yaml }}"
    dr_pbm_current: "{{ dr_config.stdout | from_yaml | default({}, true) }}"
  no_log: true
  when: not ansible_check_mode

- name: Configure PBM storage and oplog slicing
  ansible.builtin.command: "{{ dr_home }}/drctl pbm config --file {{ dr_home }}/pbm.yml"
  when:
    - not ansible_check_mode
    - >-
      dr_pbm_file.changed or dr_pbm_current.get('storage', {}).get('type') != 's3'
      or (dr_pbm_expected.storage.s3 | dict2items | rejectattr('key', 'equalto', 'credentials') | list | difference(
            dr_pbm_current.get('storage', {}).get('s3', {}) | dict2items) | length > 0)
      or dr_pbm_current.get('pitr', {}).get('enabled', false) != ('source' in group_names)
      or dr_pbm_current.get('pitr', {}).get('oplogSpanMin') | int != dr_slice_minutes | int
  no_log: true

- name: Verify the PBM identity can list the backup bucket
  ansible.builtin.command: "{{ dr_home }}/drctl {{ dr_home }}/archive_s3.py"
  changed_when: false
  when: not ansible_check_mode
