global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram-token
        chat_id: 0  # Replace with your own numeric Telegram chat ID.
        send_resolved: true
