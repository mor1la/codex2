---
- name: Validate credentials
  ansible.builtin.assert:
    that:
      - mongo_dr_password is match('^[0-9a-f]{64}$')
      - mongo_dr_key is match('^[0-9a-f]{96}$')
      - dr_retention_days | int >= 2
      - dr_slice_minutes | int >= 1
  no_log: true

- name: Install Percona repository manager
  ansible.builtin.apt:
    deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb

- name: Enable Percona repositories
  ansible.builtin.command: "percona-release enable {{ item.repo }} release"
  args:
    creates: "/etc/apt/sources.list.d/{{ item.file }}-release.list"
  loop:
    - {repo: psmdb-80, file: percona-psmdb-80}
    - {repo: pbm, file: percona-pbm}
  register: dr_repositories

- name: Install pinned server and backup packages
  ansible.builtin.apt:
    name:
      - "{{ dr_mongo_package }}"
      - "{{ dr_pbm_package }}"
      - percona-mongodb-mongosh
      - python3-boto3
      - python3-yaml
      - python3-pymongo
    update_cache: true
    cache_valid_time: "{{ 0 if dr_repositories.changed else 3600 }}"
    policy_rc_d: 101

